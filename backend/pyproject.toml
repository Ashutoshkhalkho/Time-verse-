[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timewise-backend"
version = "0.1.0"
description = "TIMEWISE: Intelligent Timetable Planning & Impact Management System Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "alembic>=1.13.3,<1.14.0",
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg[binary]>=3.2.3,<3.3.0",
    "redis>=5.2.0,<6.0.0",
    "structlog>=24.4.0,<25.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.12,<0.1.0",
    "httpx>=0.27.2,<0.28.0",
    "pandas>=2.2.3,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "ortools>=9.11.4210,<10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "ruff>=0.7.0,<0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

